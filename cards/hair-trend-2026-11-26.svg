<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1712"/>
      <stop offset="45%" stop-color="#141009"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#5a4320" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1d1712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#caa06b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8cfa0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#caa06b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- corner ornament brackets, safe zone 250 - 1670 -->
  <g stroke="#caa06b" stroke-width="2" opacity="0.65" fill="none">
    <path d="M90,300 L90,262 L140,262"/>
    <path d="M990,300 L990,262 L940,262"/>
    <path d="M90,1620 L90,1658 L140,1658"/>
    <path d="M990,1620 L990,1658 L940,1658"/>
  </g>

  <!-- kicker -->
  <text x="540" y="318" text-anchor="middle" font-family="Inter" font-size="27" letter-spacing="7" fill="#caa06b" font-weight="500">HAIR&#160;TREND&#160;DAILY</text>

  <!-- small divider -->
  <rect x="480" y="352" width="120" height="2" fill="url(#goldLine)"/>

  <!-- Title -->
  <text x="540" y="470" text-anchor="middle" font-family="Noto Serif CJK TC" font-weight="900" font-size="94" fill="#f5ede0">今日美髮時尚趨勢</text>

  <!-- date -->
  <text x="540" y="548" text-anchor="middle" font-family="Inter" font-size="36" letter-spacing="4" fill="#caa06b" font-weight="300">2026 . 11 . 26</text>

  <!-- full divider with diamond -->
  <line x1="120" y1="606" x2="960" y2="606" stroke="#5c4c33" stroke-width="1.5"/>
  <rect x="528" y="598" width="16" height="16" fill="#e8cfa0" transform="rotate(45 540 606)"/>

  <!-- Highlight 01 -->
  <text x="140" y="712" font-family="Inter" font-size="46" letter-spacing="2" fill="#caa06b" opacity="0.85" font-weight="200">01</text>
  <text x="140" y="760" font-family="Noto Sans CJK TC" font-weight="700" font-size="50" fill="#f5ede0">Pantone年度色「雲舞白」登場</text>
  <text x="140" y="826" font-family="Noto Sans CJK TC" font-weight="300" font-size="42" fill="#cdbfa6">髮色趨勢轉向霧感酒紅棕</text>

  <line x1="140" y1="882" x2="940" y2="882" stroke="#3a3024" stroke-width="1"/>

  <!-- Highlight 02 -->
  <text x="140" y="958" font-family="Inter" font-size="46" letter-spacing="2" fill="#caa06b" opacity="0.85" font-weight="200">02</text>
  <text x="140" y="1006" font-family="Noto Sans CJK TC" font-weight="700" font-size="50" fill="#f5ede0">木紋染 × 層次燙成話題</text>
  <text x="140" y="1072" font-family="Noto Sans CJK TC" font-weight="300" font-size="42" fill="#cdbfa6">低鹼度護色成沙龍新主流</text>

  <line x1="140" y1="1128" x2="940" y2="1128" stroke="#3a3024" stroke-width="1"/>

  <!-- Highlight 03 -->
  <text x="140" y="1204" font-family="Inter" font-size="46" letter-spacing="2" fill="#caa06b" opacity="0.85" font-weight="200">03</text>
  <text x="140" y="1252" font-family="Noto Sans CJK TC" font-weight="700" font-size="50" fill="#f5ede0">Dior．Chanel．Hermès</text>
  <text x="140" y="1318" font-family="Noto Sans CJK TC" font-weight="300" font-size="42" fill="#cdbfa6">冬季彩妝齊發 幸運草綠當紅</text>

  <line x1="140" y1="1374" x2="940" y2="1374" stroke="#3a3024" stroke-width="1"/>

  <!-- Highlight 04 -->
  <text x="140" y="1450" font-family="Inter" font-size="46" letter-spacing="2" fill="#caa06b" opacity="0.85" font-weight="200">04</text>
  <text x="140" y="1498" font-family="Noto Sans CJK TC" font-weight="700" font-size="50" fill="#f5ede0">男生微分碎蓋．女生層次短髮</text>
  <text x="140" y="1564" font-family="Noto Sans CJK TC" font-weight="300" font-size="42" fill="#cdbfa6">詢問度雙雙登頂</text>

  <!-- footer -->
  <rect x="480" y="1600" width="120" height="2" fill="url(#goldLine)"/>
  <text x="540" y="1640" text-anchor="middle" font-family="Inter" font-size="24" letter-spacing="5" fill="#8f7a5c" font-weight="300">HAIR&#160;SALON&#160;TREND&#160;REPORT</text>
</svg>
